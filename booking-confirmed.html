    :root {
      --navy: #0b1a2e;
      --blue: #0d2245;
      --accent: #0ea5e9;
      --bright: #38bdf8;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #081827 0%, #0b1a2e 45%, #0d2245 100%);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 560px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--bright);
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
      font-size: 1.05rem;
    }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--white);
      background: linear-gradient(135deg, var(--accent), var(--bright));
      text-decoration: none;
      padding: 0.9rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>

    <a href="https://cbssautoservice.setmore.com">Continue to Setmore</a>
  </div>

  <script>

    gtag('event', 'conversion', {
